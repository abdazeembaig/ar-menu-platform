name: Publish static menu to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html _site/index.html
          cp standalone-ar-menu.html _site/standalone-ar-menu.html
          touch _site/.nojekyll

      - name: Publish gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add _deploy origin/gh-pages
          else
            git worktree add --orphan gh-pages _deploy
          fi
          find _deploy -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +
          cp -R _site/. _deploy/
          cd _deploy
          git add .
          git commit -m "Deploy static menu" || exit 0
          git push origin HEAD:gh-pages
