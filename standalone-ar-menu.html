    ];
    function p(id,cat,en,ar,den,dar,price,img,feat,veg,spicy,allergens,prep,cal,pen,par,model,vars,mods,available=true){return{id,cat,name:{en,ar},desc:{en:den,ar:dar},full:{en:den+" Prepared fresh with balanced seasoning and a clean premium presentation.",ar:dar+" يحضر طازجاً بتتبيل متوازن وتقديم راقٍ."},price,img,feat,veg,spicy,allergens,prep,cal,portion:{en:pen,ar:par},model,ar:model,vars,mods,available,ingredients:{en:den.replaceAll(".","").split(", ").slice(0,4),ar:dar.replaceAll(".","").split(" و").slice(0,4)}}}
    let locale=localStorage.getItem("single-locale")||"en", view=location.hash||"#/", activeCat=cats[0].id, query="", detailState={qty:1,variant:null,mods:[],notes:""};
    const cartKey="single-ar-menu-cart";
    let cart=JSON.parse(localStorage.getItem(cartKey)||"[]");
    const $=s=>document.querySelector(s), L=o=>o[locale]||o.en, M=n=>`${n.toFixed(2)} LYD`, dict=k=>t[locale][k], save=()=>localStorage.setItem(cartKey,JSON.stringify(cart));
    addEventListener("hashchange",()=>{view=location.hash||"#/";detailState={qty:1,variant:null,mods:[],notes:""};render()});
    function setLocale(l){locale=l;localStorage.setItem("single-locale",l);document.documentElement.lang=l;document.documentElement.dir=l==="ar"?"rtl":"ltr";render()}
    function header(){return `<label class="language">🌐 <span class="hidden">${dict("lang")}</span><select onchange="setLocale(this.value)" aria-label="${dict("lang")}"><option value="en"${locale==="en"?" selected":""}>${dict("english")}</option><option value="ar"${locale==="ar"?" selected":""}>${dict("arabic")}</option></select></label>`}
    function totals(){const subtotal=cart.reduce((s,c)=>s+lineTotal(c),0), service=subtotal*restaurant.service, tax=subtotal*restaurant.tax;return{subtotal,service,tax,total:subtotal+service+tax,count:cart.reduce((s,c)=>s+c.qty,0)}}
    function lineTotal(c){return (c.price+(c.variant?.d||0)+c.mods.reduce((s,m)=>s+m.d,0))*c.qty}
    function addItem(item,qty=1,variant=item.vars.find(v=>v.def)||item.vars[0],mods=[],notes=""){if(!item.available)return;const lineId=[item.id,variant?.id||"base",mods.map(m=>m.id).sort().join("-"),notes.trim()].join(":");const ex=cart.find(c=>c.lineId===lineId);if(ex)ex.qty+=qty;else cart.push({lineId,id:item.id,name:item.name,img:item.img,price:item.price,qty,variant,mods,notes:notes.trim(),available:item.available});save();render()}
    function landing(){return `<main class="landing shell"><div class="top-actions"><strong>AR Menu Platform</strong>${header()}</div><section style="display:grid;gap:36px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));align-items:center"><div><p class="tag accent">📱 ${dict("demo")}: /r/brunch-cafe/t/T12</p><h1>${dict("landingTitle")}</h1><p class="muted" style="font-size:18px;line-height:1.7">${dict("landingBody")}</p><a class="btn" href="#/menu">${dict("openDemo")} →</a></div><div class="phone"><div class="phone-screen"><img src="${restaurant.cover}" alt=""><div class="skeleton" style="width:70%"></div><div class="skeleton" style="width:45%"></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div><div class="skeleton" style="height:70px;border-radius:18px"></div><div class="skeleton" style="height:70px;border-radius:18px"></div></div></div></section></main>`}
    function menu(){const total=totals(), filtered=items.filter(i=>(!query||[L(i.name),L(i.desc),...i.ingredients.en,...i.ingredients.ar].join(" ").toLowerCase().includes(query.toLowerCase()))&&(query||i.cat===activeCat));return `<main style="padding-bottom:96px"><section class="hero"><img src="${restaurant.cover}" alt="${L(restaurant.name)}"><div class="hero-content shell"><div class="hero-row"><div><div class="logo-line"><img class="logo" src="${restaurant.logo}" alt=""><span class="open-badge">${dict("open")}</span></div><h1>${L(restaurant.name)}</h1><p>${L(restaurant.branch)}</p></div><div class="table-badge"><small>${dict("table")}</small><strong>12</strong></div></div></div></section><div class="shell"><div class="top-actions">${header()}<div class="desktop-actions hidden" style="gap:8px"><button class="btn secondary">${dict("call")}</button><button class="btn secondary">${dict("bill")}</button><a class="btn" href="#/cart">${dict("cart")} · ${M(total.total)}</a></div></div><label class="search"><input type="search" value="${esc(query)}" placeholder="${dict("search")}" oninput="query=this.value;renderMenuOnly()"></label><nav class="cats">${cats.map(c=>`<button class="cat ${activeCat===c.id&&!query?"active":""}" onclick="activeCat='${c.id}';query='';render()">${L(c.name)}</button>`).join("")}</nav>${query?"":`<section class="section"><h2>${dict("featured")}</h2><div class="featured-row">${items.filter(i=>i.feat).map(card).join("")}</div></section>`}<section class="section" id="menuList"><h2>${dict("menu")}</h2>${filtered.length?cats.map(c=>{const group=filtered.filter(i=>i.cat===c.id);return group.length?`<div class="section"><h3>${L(c.name)}</h3><p class="muted">${L(c.desc)}</p><div class="grid">${group.map(card).join("")}</div></div>`:""}).join(""):`<div class="card" style="padding:34px;text-align:center">${dict("noResults")}</div>`}</section></div>${sticky()}</main>`}
    function renderMenuOnly(){render()}
    function card(i){return `<article class="item-card ${i.available?"":"sold"}"><a class="item-img" href="#/item/${i.id}" aria-label="${L(i.name)}"><img src="${i.img}" alt="${L(i.name)}" loading="lazy">${i.model?`<span class="badge3d">3D</span>`:""}</a><div class="item-body"><div class="item-title"><a href="#/item/${i.id}"><h3>${L(i.name)}</h3></a><span class="price">${M(i.price)}</span></div><p class="desc">${L(i.desc)}</p><div class="tags">${i.feat?`<span class="tag accent">${dict("featured")}</span>`:""}${i.veg?`<span class="tag green">${dict("veg")}</span>`:""}${i.spicy?`<span class="tag red">${dict("spicy")} ${i.spicy}</span>`:""}<span class="tag">${i.available?dict("available"):dict("sold")}</span></div><button class="btn quick" ${i.available?"":"disabled"} onclick="addItem(items.find(x=>x.id==='${i.id}'))">＋ ${dict("quick")}</button></div></article>`}
    function sticky(){const total=totals();return `<div class="sticky"><div class="sticky-inner"><button class="btn secondary" aria-label="${dict("call")}">☕</button><button class="btn secondary" aria-label="${dict("bill")}">⌁</button><a class="btn cart-btn" href="#/cart"><span>🛍 ${dict("viewCart")}</span><span>${total.count} ${total.count===1?dict("item"):dict("items")} · ${M(total.total)}</span></a></div></div>`}
    function detail(id){const i=items.find(x=>x.id===id)||items[0];if(!detailState.variant)detailState.variant=i.vars.find(v=>v.def)||i.vars[0]||null;const unit=i.price+(detailState.variant?.d||0)+detailState.mods.reduce((s,m)=>s+m.d,0);return `<main class="shell detail"><div><a class="btn secondary" href="#/menu">${dict("back")}</a><img class="detail-img" src="${i.img}" alt="${L(i.name)}"><section class="model card"><img src="${i.img}" alt=""><div class="model-box"><h2>${i.model?dict("missingModel"):dict("missingModel")}</h2><p class="muted">${dict("modelHint")}</p></div></section></div><div><div style="display:flex;justify-content:end">${header()}</div><div class="tags">${i.feat?`<span class="tag accent">${dict("featured")}</span>`:""}${i.veg?`<span class="tag green">${dict("veg")}</span>`:""}${i.spicy?`<span class="tag red">${dict("spicy")} ${i.spicy}</span>`:""}</div><h1>${L(i.name)}</h1><p class="price" style="font-size:26px;color:var(--accent)">${M(i.price)}</p><p class="muted" style="line-height:1.7">${L(i.full)}</p><dl class="meta"><div><small>${dict("prep")}</small><b>${i.prep} ${dict("min")}</b></div><div><small>${dict("cal")}</small><b>${i.cal}</b></div><div><small>${dict("portion")}</small><b>${L(i.portion)}</b></div></dl><h2>${dict("ingredients")}</h2><div class="chips">${i.ingredients[locale].map(x=>`<span class="chip">${x}</span>`).join("")}</div><h2>${dict("allergens")}</h2><p class="muted">${i.allergens.length?i.allergens.join(", "):"-"}</p>${i.vars.length?`<fieldset><legend><h2>${dict("variant")}</h2></legend>${i.vars.map(v=>`<label class="choice"><span>${L(v.name)}</span><span>${M(v.d)} <input type="radio" name="variant" ${detailState.variant?.id===v.id?"checked":""} onchange="detailState.variant=items.find(x=>x.id==='${i.id}').vars.find(v=>v.id==='${v.id}');render()"></span></label>`).join("")}</fieldset>`:""}${i.mods.length?`<fieldset><legend><h2>${dict("mods")}</h2></legend>${i.mods.map(m=>`<label class="choice"><span>${L(m.name)}</span><span>${M(m.d)} <input type="checkbox" ${detailState.mods.some(x=>x.id===m.id)?"checked":""} onchange="toggleMod('${i.id}','${m.id}')"></span></label>`).join("")}</fieldset>`:""}<label><h2>${dict("notes")}</h2><textarea placeholder="${dict("notesPh")}" oninput="detailState.notes=this.value">${esc(detailState.notes)}</textarea></label><p><button class="btn secondary" disabled>${dict("arUnavailable")}</button> <button class="btn secondary">${dict("view3d")}</button></p></div><div class="bottom-action"><div><div class="qty"><button class="touch" onclick="detailState.qty=Math.max(1,detailState.qty-1);render()">−</button><span>${detailState.qty}</span><button class="touch" onclick="detailState.qty++;render()">＋</button></div><button class="btn" style="flex:1;justify-content:space-between" ${i.available?"":"disabled"} onclick="addItem(items.find(x=>x.id==='${i.id}'),detailState.qty,detailState.variant,detailState.mods,detailState.notes)"><span>🛍 ${i.available?dict("addOrder"):dict("unavailable")}</span><span>${M(unit*detailState.qty)}</span></button></div></div></main>`}
    function toggleMod(itemId,modId){const m=items.find(i=>i.id===itemId).mods.find(m=>m.id===modId);detailState.mods=detailState.mods.some(x=>x.id===modId)?detailState.mods.filter(x=>x.id!==modId):[...detailState.mods,m];render()}
    function cartView(){const total=totals();return `<main class="shell" style="padding:22px 16px 60px"><header class="top-actions"><div><a class="muted" href="#/menu">${dict("back")}</a><h1>${dict("cart")}</h1><p class="muted">${dict("table")} T12</p></div>${header()}</header>${cart.length?`<div class="cart-layout"><section>${cart.map(c=>`<article class="cart-line card"><img src="${c.img}" alt=""><div><div class="item-title"><h3>${L(c.name)}</h3><b>${M(lineTotal(c))}</b></div>${c.variant?`<p class="muted">${L(c.variant.name)}</p>`:""}${c.mods.length?`<p class="muted">${c.mods.map(m=>L(m.name)).join(", ")}</p>`:""}${c.notes?`<p class="muted"><i>${esc(c.notes)}</i></p>`:""}<div class="item-title"><div class="qty"><button class="touch" onclick="changeQty('${c.lineId}',-1)">−</button><span>${c.qty}</span><button class="touch" onclick="changeQty('${c.lineId}',1)">＋</button></div><button class="btn secondary" onclick="removeLine('${c.lineId}')">${dict("remove")}</button></div></div></article>`).join("")}</section><aside class="cart-summary card"><h2>${dict("total")}</h2><div class="row"><span class="muted">${dict("subtotal")}</span><b>${M(total.subtotal)}</b></div><div class="row"><span class="muted">${dict("service")}</span><b>${M(total.service)}</b></div><div class="row"><span class="muted">${dict("tax")}</span><b>${M(total.tax)}</b></div><hr><div class="row" style="font-size:20px"><b>${dict("total")}</b><b>${M(total.total)}</b></div><a class="btn" style="width:100%" href="#/status">${dict("status")}</a><button class="btn secondary" style="width:100%;margin-top:8px" onclick="if(confirm(dict('confirmClear'))){cart=[];save();render()}">${dict("clear")}</button></aside></div>`:`<section class="card" style="padding:40px;text-align:center"><h2>${dict("empty")}</h2><p class="muted">${dict("emptyHint")}</p><a class="btn" href="#/menu">${dict("continue")}</a></section>`}</main>`}
    function changeQty(id,d){const c=cart.find(x=>x.lineId===id);if(!c)return;c.qty+=d;if(c.qty<1)cart=cart.filter(x=>x.lineId!==id);save();render()}function removeLine(id){cart=cart.filter(x=>x.lineId!==id);save();render()}
    function statusView(){const statuses=[["Submitted","تم الإرسال"],["Confirmed","تم التأكيد"],["Preparing","قيد التحضير"],["Ready","جاهز"],["Served","تم التقديم"],["Bill requested","تم طلب الفاتورة"],["Closed","مغلق"]];return `<main class="shell" style="padding:22px 16px 60px"><header class="top-actions"><div><a class="muted" href="#/menu">${dict("back")}</a><h1>${dict("status")}</h1><p class="muted">${dict("statusIntro")}</p></div>${header()}</header><section class="card" style="padding:20px;margin-bottom:20px"><small class="muted">${dict("current")}</small><h2>${locale==="ar"?statuses[2][1]:statuses[2][0]}</h2><p class="muted">${dict("table")} T12</p></section><ol class="timeline">${statuses.map((s,idx)=>`<li><div class="dot ${idx<3?"done":""}">${idx<3?"✓":"○"}</div><div class="card" style="padding:16px"><h3>${locale==="ar"?s[1]:s[0]}</h3><p class="muted">${idx<3?dict("available"):dict("statusIntro")}</p></div></li>`).join("")}</ol></main>`}
    function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}
    function render(){document.documentElement.lang=locale;document.documentElement.dir=locale==="ar"?"rtl":"ltr";view=location.hash||"#/";let html=view.startsWith("#/item/")?detail(view.split("/").pop()):view==="#/menu"?menu():view==="#/cart"?cartView():view==="#/status"?statusView():landing();$("#app").innerHTML=html}
    render();
  </script>
</body>
</html>
