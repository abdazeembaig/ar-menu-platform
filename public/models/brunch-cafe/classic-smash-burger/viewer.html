<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Classic Smash Burger 3D Viewer</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f1ea;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      model-viewer {
        width: 100%;
        height: 100%;
        min-height: 300px;
        background: #f7f1ea;
      }

      .cover {
        position: fixed;
        inset: 0;
        z-index: 2;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #f7f1ea;
        transition: opacity 180ms ease;
      }

      .cover.is-hidden {
        opacity: 0;
        pointer-events: none;
      }

      .status {
        position: fixed;
        inset: auto 16px 16px;
        z-index: 3;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 42px;
        padding: 10px 14px;
        border: 1px solid rgba(49, 37, 31, 0.14);
        border-radius: 999px;
        background: rgba(255, 252, 248, 0.92);
        color: #5c514b;
        font-size: 13px;
        font-weight: 800;
        box-shadow: 0 12px 30px rgba(49, 37, 31, 0.12);
        transition: opacity 160ms ease;
      }

      .status[hidden] {
        display: none;
      }

      .retry {
        border: 0;
        border-radius: 999px;
        background: #31251f;
        color: #fff;
        cursor: pointer;
        font: inherit;
        min-height: 30px;
        padding: 0 12px;
      }
    </style>
  </head>
  <body>
    <model-viewer
      src="model.glb?v=2"
      camera-controls
      touch-action="pan-y"
      disable-tap
      ar
      ar-modes="webxr scene-viewer quick-look"
      ar-placement="floor"
      ar-scale="fixed"
      loading="eager"
      reveal="auto"
      interaction-prompt="none"
      shadow-intensity="0.7"
      camera-orbit="35deg 58deg 0.32m"
      min-camera-orbit="auto auto 0.24m"
      max-camera-orbit="auto auto 0.7m"
      field-of-view="22deg"
      exposure="1"
      alt="RealityScan model for Classic Smash Burger"
    ></model-viewer>
    <img class="cover" src="poster.webp" alt="" aria-hidden="true" />
    <div class="status" id="status" role="status">Loading 0%</div>
    <script>
      const viewer = document.querySelector("model-viewer");
      const status = document.querySelector("#status");
      const cover = document.querySelector(".cover");

      viewer.addEventListener("progress", (event) => {
        const progress = Math.round((event.detail?.totalProgress ?? 0) * 100);
        status.textContent = `Loading ${progress}%`;
      });

      viewer.addEventListener("load", () => {
        cover.classList.add("is-hidden");
        status.hidden = true;
      });

      viewer.addEventListener("error", () => {
        cover.classList.remove("is-hidden");
        status.hidden = false;
        status.innerHTML = '<span>Model failed to load</span><button class="retry" type="button">Retry</button>';
        status.querySelector(".retry").addEventListener("click", () => {
          status.textContent = "Loading 0%";
          viewer.src = `model.glb?v=2&retry=${Date.now()}`;
        });
      });
    </script>
  </body>
</html>
