<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Classic Smash Burger 3D Viewer</title>
    <script type="module" src="../../../vendor/model-viewer/4.1.0/model-viewer.min.js"></script>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f1ea;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      model-viewer {
        width: 100%;
        height: 100%;
        min-height: 300px;
        background: #f7f1ea;
      }

      .cover {
        position: fixed;
        inset: 0;
        z-index: 2;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #f7f1ea;
        transition: opacity 180ms ease;
      }

      .cover.is-hidden {
        opacity: 0;
        pointer-events: none;
      }

      .status {
        position: fixed;
        inset: auto 16px 16px;
        z-index: 3;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 42px;
        padding: 10px 14px;
        border: 1px solid rgba(49, 37, 31, 0.14);
        border-radius: 999px;
        background: rgba(255, 252, 248, 0.92);
        color: #5c514b;
        font-size: 13px;
        font-weight: 800;
        box-shadow: 0 12px 30px rgba(49, 37, 31, 0.12);
        transition: opacity 160ms ease;
      }

      .status[hidden] {
        display: none;
      }

      .retry {
        border: 0;
        border-radius: 999px;
        background: #31251f;
        color: #fff;
        cursor: pointer;
        font: inherit;
        min-height: 30px;
        padding: 0 12px;
      }

      .hint {
        position: fixed;
        inset: 16px 16px auto;
        z-index: 3;
        width: fit-content;
        max-width: calc(100% - 32px);
        margin-inline: auto;
        padding: 9px 13px;
        border: 1px solid rgba(49, 37, 31, 0.12);
        border-radius: 999px;
        background: rgba(255, 252, 248, 0.9);
        color: #5c514b;
        font-size: 13px;
        font-weight: 800;
        box-shadow: 0 12px 30px rgba(49, 37, 31, 0.1);
      }

      .hint[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <model-viewer
      src="model.glb?v=2"
      camera-controls
      touch-action="pan-y"
      disable-tap
      ar
      ar-modes="webxr scene-viewer quick-look"
      ar-placement="floor"
      ar-scale="fixed"
      loading="eager"
      reveal="auto"
      interaction-prompt="none"
      shadow-intensity="0.7"
      camera-orbit="35deg 58deg 0.32m"
      camera-target="0m 0.065m 0m"
      min-camera-orbit="auto auto 0.24m"
      max-camera-orbit="auto auto 0.7m"
      field-of-view="22deg"
      exposure="1"
      alt="RealityScan model for Classic Smash Burger"
    ></model-viewer>
    <img class="cover" src="poster.webp" alt="" aria-hidden="true" />
    <div class="hint" id="hint">Drag to rotate · Pinch to zoom</div>
    <div class="status" id="status" role="status">Loading 0%</div>
    <script>
      const MESSAGE_SCOPE = "ar-menu:model-viewer";
      const INSPECTED_DIMENSIONS = { width: 0.28636, height: 0.13176, depth: 0.2841 };
      const RESET_CAMERA = {
        orbit: "35deg 58deg 0.32m",
        target: "0m 0.065m 0m",
        fieldOfView: "22deg",
      };
      const viewer = document.querySelector("model-viewer");
      const status = document.querySelector("#status");
      const cover = document.querySelector(".cover");
      const hint = document.querySelector("#hint");
      const params = new URLSearchParams(window.location.search);
      const lang = params.get("lang") === "ar" ? "ar" : "en";
      const usdzUrl = params.get("usdz") || "model.usdz";

      hint.textContent = lang === "ar" ? "اسحب للتدوير · قرّب بإصبعين" : "Drag to rotate · Pinch to zoom";
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";

      const postToParent = (type, payload) => {
        if (window.parent === window) {
          return;
        }
        window.parent.postMessage({ scope: MESSAGE_SCOPE, type, ...(payload ? { payload } : {}) }, window.location.origin);
      };

      const readDimensions = () => {
        try {
          if (typeof viewer.getDimensions !== "function") {
            return INSPECTED_DIMENSIONS;
          }
          const dimensions = viewer.getDimensions();
          return {
            width: Number(dimensions.x.toFixed(6)),
            height: Number(dimensions.y.toFixed(6)),
            depth: Number(dimensions.z.toFixed(6)),
          };
        } catch {
          return INSPECTED_DIMENSIONS;
        }
      };

      const reportArAvailability = (reason) => {
        postToParent("AR_AVAILABLE", {
          available: Boolean(viewer.canActivateAR),
          ...(reason ? { reason } : {}),
        });
      };

      const resetCamera = () => {
        viewer.setAttribute("camera-orbit", RESET_CAMERA.orbit);
        viewer.setAttribute("camera-target", RESET_CAMERA.target);
        viewer.setAttribute("field-of-view", RESET_CAMERA.fieldOfView);
        if (typeof viewer.jumpCameraToGoal === "function") {
          viewer.jumpCameraToGoal();
        }
      };

      const setFutureUsdzIfAvailable = () => {
        if (!usdzUrl) {
          return Promise.resolve();
        }
        return fetch(usdzUrl, { method: "HEAD", cache: "no-store" })
          .then((response) => {
            if (response.ok) {
              viewer.setAttribute("ios-src", usdzUrl);
            }
          })
          .catch(() => undefined);
      };

      postToParent("MODEL_LOADING");
      setFutureUsdzIfAvailable();

      viewer.addEventListener("progress", (event) => {
        const progress = Math.round((event.detail?.totalProgress ?? 0) * 100);
        status.textContent = `Loading ${progress}%`;
        postToParent("MODEL_PROGRESS", { progress });
      });

      viewer.addEventListener("load", () => {
        cover.classList.add("is-hidden");
        status.hidden = true;
        postToParent("MODEL_READY", { dimensions: readDimensions() });
        reportArAvailability();
      });

      viewer.addEventListener("error", () => {
        cover.classList.remove("is-hidden");
        status.hidden = false;
        status.innerHTML = '<span>Model failed to load</span><button class="retry" type="button">Retry</button>';
        postToParent("MODEL_ERROR", { message: "Model failed to load" });
        status.querySelector(".retry").addEventListener("click", () => {
          status.textContent = "Loading 0%";
          viewer.src = `model.glb?v=2&retry=${Date.now()}`;
        });
      });

      viewer.addEventListener("ar-status", (event) => {
        const arStatus = event.detail?.status || "";
        if (arStatus === "session-started" || arStatus === "object-placed") {
          postToParent("AR_STARTED", { status: arStatus });
          return;
        }
        if (arStatus === "failed") {
          postToParent("AR_FAILED", { message: "AR failed to start" });
          reportArAvailability("AR failed to start");
        }
      });

      const hideHint = () => {
        hint.hidden = true;
        postToParent("MODEL_INTERACTION");
      };

      viewer.addEventListener("pointerdown", hideHint, { once: true });
      viewer.addEventListener("touchstart", hideHint, { once: true });
      viewer.addEventListener("wheel", hideHint, { once: true });

      window.addEventListener("message", (event) => {
        if (event.origin !== window.location.origin || event.data?.scope !== MESSAGE_SCOPE) {
          return;
        }
        if (event.data.type === "RESET_CAMERA") {
          resetCamera();
          return;
        }
        if (event.data.type === "OPEN_AR") {
          if (!viewer.canActivateAR || typeof viewer.activateAR !== "function") {
            postToParent("AR_FAILED", { message: "AR is not available on this device" });
            reportArAvailability("AR is not available on this device");
            return;
          }
          Promise.resolve(viewer.activateAR()).catch((error) => {
            postToParent("AR_FAILED", { message: error?.message || "AR failed to start" });
          });
        }
      });
    </script>
  </body>
</html>
